<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>TIMES.jl Parity Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Twelve 16:9 slides, each drawn on a fixed 1280 x 720 canvas and scaled as a whole, so every slide
   exports to a Google Slides page (10 x 5.625 in) unchanged: title, accent line, then the chart.
   ESMA brand book: DM Sans (bold headings, regular body); Dark Green #004539, Dark Yellow #eaaa00 and
   White primary; Blue, Light Blue, Charcoal, Green, Turquoise secondary. Logo: the official RGB artwork,
   "on white background" on light slides and "primary" on dark ones, unaltered. */
:root{
  --dark-green:#004539; --dark-yellow:#eaaa00; --white:#ffffff; --off-white:#ebeced;
  --blue:#00a3cb; --light-blue:#10cfc9; --charcoal:#6e7c7c; --green:#00c463; --turquoise:#afe1da;
  --surface:var(--white); --tint:#f3f5f5; --ink:var(--dark-green); --muted:#56625f; --rule:var(--dark-yellow);
  --grid:rgba(0,69,57,.16); --edge:rgba(0,69,57,.35);
  /* status theme (not in the brand book; added for this board) */
  --pass:var(--green); --on-pass:var(--dark-green); --fail:#c8502a; --on-fail:#ffffff;
  --refused:var(--charcoal); --on-refused:#ffffff; --review:var(--dark-yellow);
  --cplex:var(--blue); --highs:var(--dark-green);
  /* slides 10 to 12: the two languages (James, 15 Nov 2026). GAMS orange: the brand book has no
     orange, and #e06000 keeps its separation from the yellow and the dark green (the ESMA palette's
     #ff6a1f falls under the normal-vision floor beside the yellow on dark slides). TIMES.jl in Dark
     green on light slides and in Dark yellow ("sunshine yellow") on dark slides (below) */
  --gams:#e06000; --tjl:var(--dark-green); --target:var(--dark-yellow);
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:var(--dark-green); --tint:#0b5446; --ink:var(--white); --muted:var(--turquoise);
  --grid:rgba(255,255,255,.16); --edge:rgba(175,225,218,.45); --highs:var(--white); --tjl:var(--dark-yellow); --target:var(--white);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:#d9dede;font-family:var(--sans);color:var(--ink)}
:root[data-theme="dark"] body{background:#00241e}
body{padding:20px 16px 40px}
.toolbar{max-width:1440px;margin:0 auto 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:#2c3a37}
:root[data-theme="dark"] .toolbar{color:var(--turquoise)}
.toolbar .btn{border:1px solid currentColor;background:transparent;color:inherit;padding:5px 12px;font:inherit;cursor:pointer;border-radius:999px}
.toolbar .btn:hover,.toolbar .btn:focus-visible{border-color:var(--dark-yellow);outline:none}
.toolbar input[type=file]{display:none}
.toolbar .hint{opacity:.85}
.board{max-width:1440px;margin:0 auto;display:grid;gap:24px}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--surface);color:var(--ink);overflow:hidden}

/* slide frame: title, accent line, content, footer */
.s-head{position:absolute;left:56px;right:56px;top:34px;height:84px;display:flex;justify-content:space-between;align-items:flex-start;gap:32px}
.s-head h1{margin:0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.005em}
.s-head .sub{margin-top:8px;font-size:18px;line-height:1.3;color:var(--muted)}
.logo{flex:none;width:150px;height:92px;margin-top:-10px}
.logo .on-dark{display:none}
:root[data-theme="dark"] .logo .on-white{display:none}
:root[data-theme="dark"] .logo .on-dark{display:inline}
.s-rule{position:absolute;left:56px;right:56px;top:132px;height:4px;background:var(--rule)}
.s-body{position:absolute;left:56px;right:56px;top:156px;height:500px}
.s-foot{position:absolute;left:56px;right:56px;bottom:22px;display:flex;justify-content:space-between;gap:24px;font-size:14px;line-height:1.3;color:var(--muted)}
.s-foot .pg{flex:none;font-weight:700;color:var(--ink)}
.s-body svg{display:block;width:1168px;height:500px;overflow:visible}
svg text{font-family:var(--sans)}
.num{font-variant-numeric:tabular-nums}

/* slide 1 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{background:var(--tint);padding:16px 20px 14px;border-left:6px solid var(--green);min-height:122px}
.kpi.gate{border-left-color:var(--dark-yellow)}
.kpi .v{font-size:44px;font-weight:700;line-height:1.05}
.kpi .v small{font-size:22px;font-weight:500;color:var(--muted)}
.kpi .l{font-size:16px;line-height:1.3;color:var(--muted);margin-top:6px}
.miles-h{margin:26px 0 10px;font-size:18px;font-weight:700}
.miles{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.mile{background:var(--tint);padding:10px 10px 10px;border-top:6px solid var(--edge);min-height:118px}
.mile.done{border-top-color:var(--green)} .mile.active{border-top-color:var(--dark-yellow)}
.mile .id{font-size:20px;font-weight:700}
.mile .t{font-size:15px;line-height:1.25;margin-top:2px}
.mile .n{font-size:14px;line-height:1.25;color:var(--muted);margin-top:6px}

/* legends */
.legend{display:flex;gap:26px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:8px;border:1px solid transparent}
.sw.done,.sw.pass{background:var(--pass)} .sw.fail{background:var(--fail)} .sw.refused,.sw.partial{background:var(--refused)}
.sw.review{background:repeating-linear-gradient(135deg,var(--dark-yellow) 0 4px,transparent 4px 7px);border-color:var(--dark-yellow)}
.sw.todo,.sw.notrun{border:1.5px dashed var(--edge)} .sw.next{border:3px solid var(--dark-yellow)}

/* slide 2 */
.open{columns:2;column-gap:40px;font-size:15px;line-height:1.35;margin:0;padding:0;list-style:none}
.open li{break-inside:avoid;margin-bottom:7px;padding-left:22px;position:relative}
.open li i{position:absolute;left:0;top:3px}
.open b{font-weight:700}

/* slide 3 */
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.tile{height:60px;padding:5px 7px;background:var(--tint);border:1.5px dashed var(--edge);overflow:hidden}
.tile .id{font-size:15px;font-weight:700;line-height:1.1}
.tile .t{font-size:13px;line-height:1.15;margin-top:2px}
.tile.done{background:var(--pass);border-color:transparent;color:var(--on-pass)}
.tile.review{background:repeating-linear-gradient(135deg,rgba(234,170,0,.38) 0 6px,var(--tint) 6px 12px);border:2px solid var(--dark-yellow)}
.tile.next{border:3px solid var(--dark-yellow)}

/* slide 4 */
.chain{display:grid;grid-template-columns:736px 1fr;gap:48px}
.note{background:var(--tint);padding:18px 20px;font-size:16px;line-height:1.4;border-left:6px solid var(--dark-yellow)}
.note p{margin:0 0 12px} .note p:last-child{margin:0}
.note b{font-weight:700}

/* slide 12 */
.rt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:1.15}
.rt th{font-weight:700;text-align:right;padding:0 10px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
.rt th:nth-child(-n+2),.rt td.m,.rt td.s{text-align:left;padding-left:0}
.rt td{padding:0 10px;text-align:right;white-space:nowrap}
.rt td.m,.rt td.sum{font-weight:700}
.rt td.m{white-space:normal;vertical-align:top}
.rt td.nm{color:var(--muted)}
.rt tr.g td{border-top:1px solid var(--edge)}

.tip{position:fixed;pointer-events:none;background:#ffffff;color:#004539;border:1px solid #004539;padding:8px 10px;font-size:13px;line-height:1.4;max-width:380px;z-index:5;display:none;font-family:var(--sans)}
.tip b{color:#004539}

/* one slide alone at 1280 x 720 (index.html#slide=N), for screenshots; and print, one slide per page */
html.export body{padding:0;background:var(--surface)}
html.export .toolbar{display:none}
html.export .board{display:block;max-width:none}
html.export .frame{display:none;width:1280px;height:720px;box-shadow:none}
html.export .frame.only{display:block}
@page{size:1280px 720px;margin:0}
@media print{
  body{padding:0;background:none} .toolbar{display:none} .board{display:block;max-width:none}
  .frame{width:1280px;height:720px;box-shadow:none;break-after:page;page-break-after:always}
  .slide{transform:none!important}
}
</style>
</head>

// ---- 2: coverage --------------------------------------------------------------------------------
function renderCoverage(){
  const order=["done","partial","review","todo"], names={done:"translated",partial:"translated, some paths refused",review:"in review",todo:"not started"};
  const stages=[]; for(const p of PIPELINE){let s=stages.find(x=>x.name===p[0]); if(!s){s={name:p[0],lines:0,by:{done:0,partial:0,review:0,todo:0},files:[]}; stages.push(s);} s.lines+=p[2]; s.by[p[3]]+=p[2]; s.files.push(p);}
  const total=stages.reduce((a,s)=>a+s.lines,0), started=stages.reduce((a,s)=>a+s.lines-s.by.todo,0);
  const fill={done:css('--pass'),partial:css('--refused'),review:css('--dark-yellow'),todo:'none'};
  const fg={done:css('--on-pass'),partial:css('--on-refused'),review:'#004539',todo:css('--muted')};
  const L=230, BW=938, rh=34, gap=9;
  let s=svgOpen(6*(rh+gap));
  stages.forEach((st,i)=>{const y=i*(rh+gap); let x=L;
    s+=`<text x="0" y="${y+15}" font-size="17" font-weight="700" fill="${css('--ink')}">${st.name}</text><text x="0" y="${y+33}" font-size="14" fill="${css('--muted')}">${fmt(st.lines)} lines of GAMS</text>`;
    for(const k of order){const v=st.by[k]; if(!v) continue; const w=BW*v/st.lines;
      s+= k==='todo' ? `<rect x="${x+.75}" y="${y+.75}" width="${w-1.5}" height="${rh-1.5}" fill="none" stroke="${css('--edge')}" stroke-width="1.5" stroke-dasharray="4 3"/>`
                     : `<rect x="${x}" y="${y}" width="${w-2}" height="${rh}" fill="${fill[k]}"/>`;
      if(w>70) s+=`<text x="${x+10}" y="${y+rh/2+5}" font-size="15" fill="${fg[k]}" class="num">${fmt(v)}</text>`;
      x+=w;}
    });
  s+='</svg>';
  const rank={review:0,todo:1,partial:2}, open=PIPELINE.filter(p=>p[3]!=='done').sort((a,b)=>rank[a[3]]-rank[b[3]]), shown=12;
  set('coverage-sub',`${fmt(started)} of ${fmt(total)} lines of TIMES v4.9.7 GAMS translated or in review (${Math.round(100*started/total)}%)`);
  set('coverage-body',`${s}<div class="legend" style="margin:4px 0 16px">${order.map(k=>`<span><i class="sw ${k}"></i>${names[k]}</span>`).join('')}<span>· numbers: lines of GAMS</span></div>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">Files not yet complete</div><ul class="open">${open.slice(0,shown).map(p=>`<li><i class="sw ${p[3]}"></i><b>${p[1]}</b> · ${p[4]}</li>`).join('')}</ul>`);
  set('coverage-foot',`${open.length>shown?`${open.length-shown} more files translated with refused paths (docs/m13-plan.md) · `:''}refused: TIMES.jl stops with a message rather than give a wrong answer`);
}

// ---- 6, 7: parity by run ------------------------------------------------------------------------
function renderParity(kind){
  const all=allRuns(), checks=allChecks();
  const runs=all.filter(r=>kind==='ci'?isCI(r):!isCI(r));
  const rows=kind==='ci'?runs.map(r=>({real:true,r})):[...runs.map(r=>({real:true,r})),...PLANNED_RUNS.filter(p=>!runs.some(r=>r.model===p.model)).map(p=>({real:false,r:p}))];
  // one cell of run r for column c: layer 1 by file ('l1') or all files together ('l1c'), families, matrix, objective
  const mk=(c,x,y,w,rh,real,r)=>{
    if(!real) return cell(x,y,w,rh,null,'',`<b>${r.model}</b><br>no reference loaded`);
    if(c.k==='fam'){const fs=checks.filter(k=>k.run===r.id&&k.layer===2&&k.unit!=='matrix'); if(!fs.length) return cell(x,y,w,rh,null,'',`<b>${r.model}</b><br>no family checks`);
      const p=fs.filter(k=>k.status==='pass').length, st=fs.some(k=>k.status==='fail')?'fail':fs.some(k=>k.status==='refused')?'refused':'pass';
      return cell(x,y,w,rh,st,`${p} / ${fs.length}`,`<b>${r.model}</b> · ${variantName(r.variant)}<br>equation families passing: ${p} of ${fs.length}`);}
    if(c.k==='l1c'){const fs=checks.filter(k=>k.run===r.id&&k.layer===1&&k.status!=='skipped'); if(!fs.length) return cell(x,y,w,rh,null,'',`<b>${r.model}</b> · coefficient files<br>not run`);
      const st=fs.some(k=>k.status==='fail')?'fail':fs.some(k=>k.status==='refused')?'refused':'pass', n=fs.reduce((a,k)=>a+(k.n_compared||0),0), ex=fs.reduce((a,k)=>a+(k.n_excluded||0),0);
      const excl=ex>0?`<rect x="${x}" y="${y+rh-4}" width="${w*Math.min(1,ex/Math.max(1,n+ex))}" height="4" fill="${css('--dark-yellow')}"/>`:'';
      return cell(x,y,w,rh,st,st==='refused'?'refused':compact(n),`<b>${r.model}</b> · ${variantName(r.variant)} · coefficient files<br>${fs.map(k=>`${k.unit}: ${k.status}, ${fmt(k.n_compared)}${k.n_excluded?` (${fmt(k.n_excluded)} left to a later file)`:''}`).join('<br>')}`,excl);}
    const ck=checks.find(k=>k.run===r.id&&String(k.unit).toUpperCase()===c.unit.toUpperCase()&&(c.k==='l1'?k.layer===1:c.k==='mat'?k.layer===2:k.layer===3));
    if(!ck||ck.status==='skipped') return cell(x,y,w,rh,null,'',`<b>${r.model}</b> · ${c.label}<br>not run`);
    const txt=c.k==='l3'?(ck.rel_diff!=null?sci(ck.rel_diff):ck.status):ck.status==='refused'?'refused':compact(ck.n_compared);
    const excl=ck.n_excluded>0?`<rect x="${x}" y="${y+rh-4}" width="${w*Math.min(1,ck.n_excluded/Math.max(1,ck.n_compared+ck.n_excluded))}" height="4" fill="${css('--dark-yellow')}"/>`:'';
    const info=`<b>${r.model}</b> · ${variantName(r.variant)} · ${c.label}<br>status: ${ck.status}${ck.n_compared!=null?`<br>compared: ${fmt(ck.n_compared)}`:''}${ck.n_excluded?`<br>left to a later file: ${fmt(ck.n_excluded)}`:''}${ck.n_mismatch?`<br>mismatches: ${fmt(ck.n_mismatch)}`:''}${ck.rel_diff!=null?`<br>relative objective difference: ${ck.rel_diff.toExponential(2)}`:''}${(ck.detail||[]).length?`<br>${esc(ck.detail.slice(0,2).join('; '))}`:''}`;
    return cell(x,y,w,rh,ck.status,txt,info,excl);};
  let s=svgOpen(500);
  const grp=(t,a,b,fs=15)=>{s+=`<text x="${a.x}" y="16" font-size="${fs}" font-weight="700" fill="${css('--ink')}">${t}</text><line x1="${a.x}" x2="${b.x+b.w}" y1="24" y2="24" stroke="${css('--dark-yellow')}" stroke-width="2"/>`;};
  const top=62;
  if(kind==='ci'&&rows.length>20){
    // many CI runs: two panels of half the runs each; the seven coefficient files in one cell
    const half=Math.ceil(rows.length/2), PW=564, nameW=204, gap=3, rh=Math.min(28,Math.floor((500-top-6)/half)-gap);
    [rows.slice(0,half),rows.slice(half)].forEach((part,b)=>{const x0=b*(PW+40); let x=x0+nameW;
      const cs=[{k:'l1c',label:'7 files',w:70},{k:'fam',label:'families',w:66},{k:'mat',unit:'matrix',label:'matrix',w:62},...SOLVERS.map(u=>({k:'l3',unit:u,label:u==='HIGHS'?'HiGHS':u,w:62}))]
        .map(c=>{const o={...c,x}; x+=c.w+(c.k==='l1c'||c.k==='mat'?12:4); return o;});
      grp("Layer 1",cs[0],cs[0],14); grp("Layer 2 · rows",cs[1],cs[2],14); grp("Layer 3 · objective",cs[3],cs[4],14);
      cs.forEach(c=>{s+=`<text x="${c.x+c.w/2}" y="48" font-size="14" text-anchor="middle" fill="${css('--ink')}">${c.label}</text>`;});
      s+=`<text x="${x0}" y="48" font-size="15" font-weight="700" fill="${css('--ink')}">Test case · variant</text>`;
      part.forEach(({real,r},j)=>{const y=top+j*(rh+gap);
        s+=`<text x="${x0}" y="${y+rh/2+5}" font-size="14" fill="${css('--ink')}"><tspan font-weight="700">${shortModel(r.model)}</tspan> · ${variantName(r.variant)}</text>`;
        cs.forEach(c=>{s+=mk(c,c.x,y,c.w,rh,real,r);});});});
  } else {
  const L=kind==='ci'?250:330, avail=500-top-6, rh=Math.min(40,Math.floor(avail/rows.length)-4), gap=4;
  const cols=[...COEF_FILES.map(u=>({k:'l1',unit:u,label:u.replace('coef_',''),w:58})),{k:'fam',label:'families',w:96},{k:'mat',unit:'matrix',label:'matrix',w:80},...SOLVERS.map(u=>({k:'l3',unit:u,label:u==='HIGHS'?'HiGHS':u,w:84}))];
  let x=L; cols.forEach(c=>{c.x=x; x+=c.w+(c.k==='l1'&&c.unit==='coef_ext'||c.k==='mat'?18:4);});
  grp("Layer 1 · coefficient files",cols[0],cols[6]); grp("Layer 2 · rows",cols[7],cols[8]); grp("Layer 3 · objective",cols[9],cols[10]);
  cols.forEach(c=>{s+=`<text x="${c.x+c.w/2}" y="48" font-size="15" text-anchor="middle" fill="${css('--ink')}">${c.label}</text>`;});
  s+=`<text x="0" y="48" font-size="15" font-weight="700" fill="${css('--ink')}">${kind==='ci'?'Test case · variant':'Model · report date'}</text>`;
  rows.forEach(({real,r},j)=>{const y=top+j*(rh+gap), two=rh>=36;
    s+= two ? `<text x="0" y="${y+16}" font-size="16" font-weight="700" fill="${real?css('--ink'):css('--muted')}">${shortModel(r.model)}</text><text x="0" y="${y+33}" font-size="14" fill="${css('--muted')}">${variantName(r.variant)} · ${esc(r.licence||'')}</text>`
            : kind==='ci' ? `<text x="0" y="${y+rh/2+5}" font-size="15" fill="${css('--ink')}"><tspan font-weight="700">${shortModel(r.model)}</tspan> · ${variantName(r.variant)}</text>`
            : `<text x="0" y="${y+rh/2+5}" font-size="15" fill="${real?css('--ink'):css('--muted')}"><tspan font-weight="700">${shortModel(r.model)}</tspan>${real?` · ${dateShort(r.source_date)}`:''}</text>`;
    cols.forEach(c=>{s+=mk(c,c.x,y,c.w,rh,real,r);});});
  }
  s+='</svg>';
  const nCk=checks.filter(c=>runs.some(r=>r.id===c.run)), p=nCk.filter(c=>c.status==='pass').length;
  set(`${kind}-sub`, kind==='ci'
    ? `${runs.length} runs of demo12 and crafted variants (CC BY 4.0), in CI on every pull request · ${fmt(p)} of ${fmt(nCk.length)} checks pass`
    : `REDUCE off, GAMS 54.6.1 references · each run's latest report (date beside it); a whole-model batch refreshes them`);
  set(`${kind}-body`,s);
  set(`${kind}-foot`,(kind==='suite'?`${fmt(p)} of ${fmt(nCk.length)} checks pass · refused: a gap open at the report date (TIMES-NZ and OTCGEN: closed by changes 21-24) · `:rows.length>20?'Layer 1: the seven coefficient files together · ':'')+"Numbers: records compared at 1e-9 (layers 1-2) and the relative objective difference (layer 3, gate 1e-6) · yellow underline: records left to a later coefficient file · dashed: not run");
}

// ---- 8: equation families -----------------------------------------------------------------------

    fams.slice(b*per,(b+1)*per).forEach((f,j)=>{const y=30+j*rh, cs=checks.filter(c=>c.unit===f), p=cs.filter(c=>c.status==='pass').length, fl=cs.filter(c=>c.status==='fail').length, rf=cs.length-p-fl;

// ---- 9: objective -------------------------------------------------------------------------------
function renderObjective(){
  const checks=allChecks().filter(c=>c.layer===3), runs=allRuns().filter(r=>checks.some(c=>c.run===r.id));
  const parts=[runs.filter(isCI),runs.filter(r=>!isCI(r))], titles=["CI test cases (demo12 and crafted variants)","Public reference models"];
  const lo=-16, hi=-3, PW=564, lw=210, ax0=lw+10, ax1=PW-10, X=v=>ax0+(Math.log10(Math.max(v,10**lo))-lo)/(hi-lo)*(ax1-ax0);
  let s=svgOpen(500);
  parts.forEach((rs,b)=>{const x0=b*(PW+40), rh=Math.min(36,Math.floor(400/Math.max(rs.length,1))), top=70, yEnd=top+rs.length*rh;
    s+=`<text x="${x0}" y="18" font-size="16" font-weight="700" fill="${css('--ink')}">${titles[b]}</text>`;
    for(let e=lo;e<=hi;e++){const xx=x0+X(10**e); s+=`<line x1="${xx}" x2="${xx}" y1="${top-8}" y2="${yEnd}" stroke="${css('--grid')}" stroke-width="${e%3===0?1:.5}"/>`; if(e%3===0) s+=`<text x="${xx}" y="${top-16}" font-size="14" text-anchor="middle" fill="${css('--muted')}">1e−${-e}</text>`;}

// ---- 11, 12: the time of each run and of its parts (scripts/run_timing.jl) -------------------------
// a part of a run: key, column heading, what it covers in GAMS, what it covers in TIMES.jl
const RT_PARTS = [
  ["read","Read input","GAMS starts and compiles the run file, the TIMES source and the DD files","TIMES.jl reads the DD files"],
  ["prep","Preprocessing","maindrv.mod from init_ext to the end of ppm_ext (GAMS's profile)","the steps input → init → prep → prelv → ppm"],
  ["coef","Coefficients","from the end of preprocessing to the SOLVE statement (GAMS's profile)","the steps ppm → coef → presolve"],
  ["generate","Generation","GAMS generates the LP (its own figure, resgen)","generate!: the JuMP model is built"],
  ["solve","Solve","the solver's time as GAMS reports it (etsolver)","JuMP.optimize! with HiGHS"],
  ["reports","Reports","the statements after the solve (GAMS's profile)","TIMES.jl does not write reports yet (milestone M1.6)"],
];
// one series per language and solver: the colour is the language (GAMS orange, TIMES.jl dark green or yellow), the shape is
// the solver (CPLEX a circle, HiGHS an isosceles triangle pointing up); James, 14 Nov 2026
const RT_SERIES = [
  {language:"GAMS", solver:"CPLEX", label:"GAMS · CPLEX", color:"--gams", shape:"circle", filled:true, restricted:true},
  {language:"GAMS", solver:"HIGHS", label:"GAMS · HiGHS", color:"--gams", shape:"triangle", filled:true},
  {language:"TIMES.jl", solver:"CPLEX", label:"TIMES.jl · CPLEX", color:"--tjl", shape:"circle", filled:true, restricted:true},
  {language:"TIMES.jl", solver:"HIGHS", label:"TIMES.jl · HiGHS", color:"--tjl", shape:"triangle", filled:true},
];
const rtSeries = e => RT_SERIES.find(s=>s.language===e.language&&s.solver===e.solver) || {label:`${e.language} · ${e.solver}`, color:"--charcoal", shape:"square", filled:true};
const rtToLP = e => ["read","prep","coef","generate"].every(k=>e.parts[k]!=null) ? e.parts.read+e.parts.prep+e.parts.coef+e.parts.generate : null;
// seconds as text; d = the decimals the source gives (GAMS 3, TIMES.jl's log 1)
const rtSec = (v, d=2) => v<0.995 ? v.toFixed(Math.min(2,d)) : v<99.95 ? v.toFixed(1) : fmt(Math.round(v));
const rtName = m => shortModel(m).replace('-v308','');
const rtRange = ds => { const d=[...new Set(ds.filter(x=>x))].sort(); return !d.length ? '' : d[0]===d[d.length-1] ? dateShort(d[0]) : `${dateShort(d[0])} to ${dateShort(d[d.length-1])}`; };
// a mark of a series at (x, y): filled, a ring (not filled), or faint; with an arrow up for a run stopped at its time limit
function rtMark(sr, x, y, o={}){
  const col=css(sr.color), sf=css('--surface'), filled=o.filled!=null?o.filled:sr.filled, k=filled||o.faint?0:1;
  const a=o.faint?`fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="1.5"`:filled?`fill="${col}" stroke="${sf}" stroke-width="2"`:`fill="${sf}" stroke="${col}" stroke-width="3"`;
  let m=sr.shape==='circle'?`<circle cx="${x}" cy="${y}" r="${7.5-k}" ${a}/>`
       :sr.shape==='triangle'?`<path d="${triUp(x,y,k)}" ${a}/>`
       :`<rect x="${x-6.5+k}" y="${y-6.5+k}" width="${13-2*k}" height="${13-2*k}" ${a}/>`;
  if(o.limit) m+=`<path d="M${x} ${y-11}v-13m-5 5.5l5 -5.5l5 5.5" fill="none" stroke="${col}" stroke-width="2.5"/>`;
  return m;
}
const rtIcon = (sr,o) => `<svg viewBox="-10 -10 20 20" style="display:inline-block;width:20px;height:20px;vertical-align:-5px;margin-right:6px;overflow:visible">${rtMark(sr,0,0,o)}</svg>`;

function renderRunTime(){
  const A=[], B=[];
  for(const r of RUNTIME){ const seen={};
    for(const e of r.timing){ const sr=rtSeries(e), lp=rtToLP(e);
      if(lp!=null&&!seen[e.language]){seen[e.language]=1; A.push({r,e,sr,v:lp,filled:true,faint:e.cold});}
      if(e.parts.solve!=null) B.push({r,e,sr,v:e.parts.solve,limit:e.status==='time limit'}); } }
  const all=[...A,...B];
  if(!all.length){ set('runtime-sub','No run timings in this page'); set('runtime-body',''); set('runtime-foot','scripts/run_timing.jl'); return; }
  // shared scales: log seconds up, log variables across
  const PW=564, L=84, T=46, Y1=366, cols=RUNTIME.map(r=>r.cols), xl=Math.log10(Math.min(...cols)/1.5), xh=Math.log10(Math.max(...cols)*1.5);
  const yl=Math.floor(Math.log10(Math.max(Math.min(...all.map(p=>p.v)),1e-3))), yh=Math.ceil(Math.log10(Math.max(...all.map(p=>p.v))));
  const X=c=>L+(Math.log10(c)-xl)/(xh-xl)*(PW-L-16), Y=v=>T+(yh-Math.log10(Math.max(v,10**yl)))/(yh-yl)*(Y1-T);
  const xt=[]; for(let k=0;k<10;k++) for(const m of [1,3]){const v=m*10**k; if(Math.log10(v)>=xl-1e-9&&Math.log10(v)<=xh) xt.push(v);}
  const ink=css('--ink'), muted=css('--muted'), grid=css('--grid');
  const head=p=>`<b>${rtName(p.r.model)}</b> · ${variantName(p.r.variant)}<br>${fmt(p.r.cols)} variables · ${fmt(p.r.rows)} rows<br>`;
  const made=e=>`${dateShort(e.date)} · ${e.version} · ${e.commit} · ${e.threads||'?'} threads`;
  const tipA=p=>{const g=A.find(q=>q.r===p.r&&q.e.language==='GAMS'), x=p.e.parts;
    return head(p)+`<b>${p.e.language}</b>, input files to the LP: ${rtSec(p.v,p.e.decimals)} s${g&&g!==p?` (${fmt(p.v/g.v,1)} times GAMS)`:''}<br>read ${rtSec(x.read,p.e.decimals)} · preprocessing ${rtSec(x.prep,p.e.decimals)} · coefficients ${rtSec(x.coef,p.e.decimals)} · generation ${rtSec(x.generate,p.e.decimals)}<br>${p.e.cold?'first run of its Julia process: it also compiles TIMES.jl<br>':''}${made(p.e)}`;};
  const tipB=p=>head(p)+`<b>${p.sr.label}</b>, solve: ${rtSec(p.v,p.e.decimals)} s${p.limit?' (stopped at the time limit, no optimum)':''}<br>${made(p.e)}`;
  const panel=(x0,title,pts,tipOf,legend)=>{
    let s=`<text x="${x0}" y="18" font-size="16" font-weight="700" fill="${ink}">${title}</text>`;
    for(let e=yl;e<=yh;e++){const y=Y(10**e); s+=`<line x1="${x0+L}" x2="${x0+PW-16}" y1="${y}" y2="${y}" stroke="${grid}" stroke-width="1"/><text x="${x0+L-10}" y="${y+5}" font-size="14" text-anchor="end" fill="${muted}" class="num">${fmt(10**e,1)} s</text>`;}
    for(const v of xt){const x=x0+X(v); s+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${Y1}" stroke="${grid}" stroke-width="${String(v)[0]==='1'?1:.5}"/><text x="${x}" y="${Y1+20}" font-size="14" text-anchor="middle" fill="${muted}" class="num">${compact(v).replace('.0','')}</text>`;}
    s+=`<line x1="${x0+L}" x2="${x0+PW-16}" y1="${Y1}" y2="${Y1}" stroke="${ink}" stroke-width="1"/><text x="${x0+L+(PW-L-16)/2}" y="${Y1+42}" font-size="14" text-anchor="middle" fill="${muted}">variables in the LP (columns), log scale</text>`;
    // a thin line joins the runs of one model-scenario pair and variant (they have the same LP)
    for(const r of new Set(pts.map(p=>p.r))){const ys=pts.filter(p=>p.r===r).map(p=>Y(p.v)); if(ys.length>1) s+=`<line x1="${x0+X(r.cols)}" x2="${x0+X(r.cols)}" y1="${Math.min(...ys)}" y2="${Math.max(...ys)}" stroke="${css('--edge')}" stroke-width="1"/>`;}
    // callout labels (James, 15 Nov 2026): one per model-scenario pair, with a leader line to the top mark of each of its
    // variants (one LP each); stacked in the widest empty band of the x axis, in the order of their marks' mean height.
    // A label whose marks lie left of the band is left-aligned at the band's left side, the others right-aligned at its right.
    const runsOf={}; for(const p of pts) (runsOf[p.r.model]=runsOf[p.r.model]||new Set()).add(p.r);
    const groups=Object.entries(runsOf).map(([m,rs])=>{const tg=[...rs].map(r=>({r,x:x0+X(r.cols),y:Math.min(...pts.filter(p=>p.r===r).map(p=>Y(p.v)))}));
      return {m,tg,y:tg.reduce((a,q)=>a+q.y,0)/tg.length};});
    if(groups.length){
      const xs=[...new Set(groups.flatMap(g=>g.tg.map(q=>q.x)))].sort((a,b)=>a-b), edges=[x0+L,...xs,x0+PW-16];
      let gl=edges[0], gr=edges[1]; for(let i=1;i<edges.length;i++) if(edges[i]-edges[i-1]>gr-gl){gl=edges[i-1]; gr=edges[i];}
      const fs=13, step=21, txt=g=>rtName(g.m);
      groups.sort((a,b)=>a.y-b.y);
      let prev=-Infinity; for(const g of groups){g.ly=Math.max(g.y+4,prev+step); prev=g.ly;}
      let next=Y1-6+step; for(let i=groups.length-1;i>=0;i--){groups[i].ly=Math.min(groups[i].ly,next-step); next=groups[i].ly;}
      for(const g of groups){ const w=txt(g).length*fs*0.55, left=g.tg.every(q=>q.x<=gl);
        const tx=left?gl+18:gr-18, sx=left?tx-4:tx+4;
        for(const q of g.tg) s+=`<path d="M${sx} ${g.ly-4.5}L${q.x} ${q.y}" fill="none" stroke="${muted}" stroke-width="1" stroke-opacity=".8"/>`;
        s+=`<text x="${tx}" y="${g.ly}" font-size="${fs}" font-weight="700" text-anchor="${left?'start':'end'}" fill="${ink}" data-tip="${esc(`<b>${rtName(g.m)}</b><br>`+g.tg.sort((a,b)=>a.x-b.x).map(q=>`${variantName(q.r.variant)}: ${fmt(q.r.cols)} variables · ${fmt(q.r.rows)} rows`).join('<br>'))}">${txt(g)}</text>`; }
    }
    for(const p of [...pts].sort((a,b)=>(b.faint?1:0)-(a.faint?1:0))) s+=`<g data-tip="${esc(tipOf(p))}"><circle cx="${x0+X(p.r.cols)}" cy="${Y(p.v)}" r="12" fill="transparent"/>${rtMark(p.sr,x0+X(p.r.cols),Y(p.v),p)}</g>`;
    legend.forEach((row,j)=>{let x=x0; for(const [mark,text,soft] of row){ if(mark) s+=mark(x+10,438+j*26-5); s+=`<text x="${x+(mark?26:0)}" y="${438+j*26}" font-size="15" fill="${soft?muted:ink}">${text}</text>`; x+=(mark?26:0)+text.length*7.6+26; }});
    return s;
  };
  const lang=l=>RT_SERIES.find(s=>s.language===l), usedB=RT_SERIES.filter(s=>B.some(p=>p.sr===s)), notRun=RT_SERIES.filter(s=>!B.some(p=>p.sr===s)&&!(s.restricted&&rtNotPublished()));
  // panel A: one mark per language, that of the run its time comes from (the first of the language)
  const inA=l=>(A.find(p=>p.e.language===l)||{sr:lang(l)}).sr, sv=sr=>(sr.label.split(' · ')[1]||'')+' run';
  const legA=[[[(x,y)=>rtMark(inA('GAMS'),x,y,{filled:true}),`GAMS (${sv(inA('GAMS'))})`],[(x,y)=>rtMark(inA('TIMES.jl'),x,y,{filled:true}),`TIMES.jl, warm (${sv(inA('TIMES.jl'))})`]]];
  if(A.some(p=>p.faint)) legA.push([[(x,y)=>rtMark(inA('TIMES.jl'),x,y,{faint:true}),'TIMES.jl, first run of its Julia process: it also compiles TIMES.jl']]);
  legA.push([[null,'A line joins the runs of one LP; as run is left of REDUCE off.',true]]);
  const legB=[[]]; let lw=0;
  for(const sr of usedB){ const w=52+sr.label.length*7.6; if(lw+w>PW-8&&legB[legB.length-1].length){legB.push([]); lw=0;} legB[legB.length-1].push([(x,y)=>rtMark(sr,x,y),sr.label]); lw+=w; }
  if(B.some(p=>p.limit)) legB.push([[(x,y)=>`<path d="M${x} ${y+8}v-15m-5 5.5l5 -5.5l5 5.5" fill="none" stroke="${ink}" stroke-width="2.5"/>`,'stopped at its time limit without an optimum: at least this long']]);
  if(notRun.length&&legB.length<3) legB.push([[null,`Not run: ${notRun.map(s=>s.label).join(', ')}.`,true]]);
  let s=svgOpen(500)+panel(0,'Input files to the LP: read, preprocess, coefficients, generate',A,tipA,legA)+panel(PW+40,'Solve the LP',B,tipB,legB)+'</svg>';
  // the message: TIMES.jl against GAMS on the way to the LP, warm runs only
  const ratios=A.filter(p=>p.e.language==='TIMES.jl'&&!p.faint).map(p=>{const g=A.find(q=>q.r===p.r&&q.e.language==='GAMS'); return g?p.v/g.v:null;}).filter(v=>v!=null);
  const es=RUNTIME.flatMap(r=>r.timing), gs=es.filter(e=>e.language==='GAMS'), js=es.filter(e=>e.language==='TIMES.jl');
  set('runtime-sub',`Seconds against LP size, log scales`+(ratios.length?` · to the LP, TIMES.jl takes ${fmt(Math.min(...ratios))} to ${fmt(Math.max(...ratios))} times GAMS's time (warm) · speed: Phase 2`:''));
  set('runtime-body',s);
  set('runtime-foot',`Workstation, at most 12 threads a run · ${[...new Set(gs.map(e=>e.version))].join(', ')}, references of ${rtRange(gs.map(e=>e.date))} · TIMES.jl: ${[...new Set(js.map(e=>e.commit.replace('TIMES.jl ','')))].join(', ')}, batch of ${rtRange(js.map(e=>e.date))}, up to three runs at once · both variants of each model${rtNotPublished()} · scripts/run_timing.jl`);
}

// keep: which runs (model-scenario pair and variant) the table shows; rows: which of their entries
function renderRunParts(id='runparts', keep=r=>r.variant==='as_run', rows=e=>true){
  const runs=RUNTIME.filter(keep), n=runs.reduce((a,r)=>a+r.timing.filter(rows).length,0), rh=Math.max(20,Math.min(27,Math.floor(432/Math.max(n,1))));
  // a part without a time: not run, not reached (TIMES.jl stops at a path of TIMES not translated yet), or not measured
  const ends=(e,k)=>/^ends before/.test(e.status)&&k!=='read'&&k!=='reports', steps=(e,k)=>/solves in steps/.test(e.status)&&k!=='read'&&k!=='prep';
  const why=(e,k)=>k==='solve'&&e.status==='not run'?"no HiGHS solve: this model is checked by evaluating GAMS's optimum in TIMES.jl's LP"
    :ends(e,k)?'TIMES.jl stops before this part: the model uses a path of TIMES that is not translated yet'
    :steps(e,k)?`this run has ${e.status}: its time after preprocessing is not split into parts`
    :k==='reports'&&e.language!=='GAMS'?RT_PARTS[5][3]:'this part was not timed in this run';
  const none=(e,k)=>k==='solve'&&e.status==='not run'?'not run':ends(e,k)?'not reached':'not measured';
  let body='';
  for(const r of runs) r.timing.filter(rows).forEach((e,i,es)=>{
    const sr=rtSeries(e), tot=RT_PARTS.reduce((a,[k])=>a+(e.parts[k]||0),0), lp=rtToLP(e), gi=e.language==='GAMS'?2:3, d=e.decimals;
    const tipHead=`<b>${rtName(r.model)}</b> · ${variantName(r.variant)} · ${sr.label}<br>`;
    const part=([k,label,...what])=>{const v=e.parts[k];
      if(v==null) return `<td class="nm" data-tip="${esc(tipHead+label+': '+why(e,k))}">${none(e,k)}</td>`;
      const lim=k==='solve'&&e.status==='time limit';
      return `<td class="num" style="background:color-mix(in srgb,var(--ink) ${Math.round(v/tot*30)}%,transparent)" data-tip="${esc(tipHead+`${label}: ${rtSec(v,d)} s, ${fmt(v/tot*100)}% of the ${rtSec(tot,d)} s measured${lim?' · stopped at the time limit, no optimum':''}<br>${what[gi-2]}`)}">${lim?'↑ ':''}${rtSec(v,d)}</td>`;};
    const wallTip=e.language==='GAMS'?`Wall time of the whole GAMS job: ${rtSec(e.wall||0)} s`+(e.other!=null?`<br>${rtSec(Math.max(e.other,0))} s of it are outside the parts: the harness's dumps (${rtSec(e.harness.dumps||0)} s), GAMS's start and exit`:'')
      :`Wall time of this run in the batch: ${rtSec(e.wall||0,d)} s`+(e.other!=null?`<br>${rtSec(Math.max(e.other,0),d)} s of it are outside the parts: its checks against GAMS, and writing and reading the harness's copy of the input`+(e.cold?'; as the first run of its Julia process, also loading and compiling TIMES.jl':''):'');
    const whole=e.wall!=null?`<td class="num sum" data-tip="${esc(tipHead+wallTip)}">${rtSec(e.wall,e.language==='GAMS'?2:d)}</td>`
      :`<td class="nm" data-tip="${esc(tipHead+(e.language==='GAMS'?'Whole run: not timed in this run':'Whole run: this batch ran before scripts/m13_gate.jl timed each run'))}">not measured</td>`;
    body+=`<tr${i===0?' class="g"':''} style="height:${rh}px">${i===0?`<td class="m" rowspan="${es.length}" style="padding-top:${(rh-16)/2}px">${rtName(r.model)}</td>`:''}<td class="s" data-tip="${esc(tipHead+`${fmt(r.cols)} variables · ${fmt(r.rows)} rows<br>${dateShort(e.date)} · ${e.version} · ${e.commit} · ${e.threads||'?'} threads`)}">${rtIcon(sr)}${sr.label}</td>`
      +RT_PARTS.slice(0,4).map(part).join('')+(lp!=null?`<td class="num sum">${rtSec(lp,d)}</td>`:`<td class="nm" data-tip="${esc(tipHead+'To the LP: '+why(e,e.parts.coef==null?'coef':'generate'))}">${none(e,e.parts.coef==null?'coef':'generate')}</td>`)+RT_PARTS.slice(4).map(part).join('')+whole+`</tr>`;});
  const th=RT_PARTS.map(p=>p[1]);
  set(id+'-sub',`Seconds per part, ${runs.every(r=>r.variant==='as_run')?'as-run variant, ':''}one row per language and solver · shading: the part's share of the run's time`);
  set(id+'-body',`<table class="rt"><thead><tr><th style="width:176px">Model and scenario</th><th style="width:150px">Run</th>${[...th.slice(0,4),'To the LP',...th.slice(4),'Whole run'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
<div class="legend" style="margin-top:12px;font-size:14px"><span><b>To the LP</b> = the four parts before it</span><span>↑ stopped at its time limit without an optimum</span><span><b>not measured</b>: never timed (hover for why)</span></div>`);
  set(id+'-foot',`The runs of slide 11 · Whole run: wall time; GAMS's holds the harness's dumps, TIMES.jl's its checks against GAMS · TIMES.jl's parts also read the harness's copy of the input · TIMES.jl with CPLEX was never run${rtNotPublished()} · scripts/run_timing.jl`);
}

// ---- page ---------------------------------------------------------------------------------------
function fit(){ document.querySelectorAll('.frame').forEach(f=>{const k=f.clientWidth/1280; f.firstElementChild.style.transform=Math.abs(k-1)<1e-3?'':`scale(${k})`;}); }
function renderAll(){ for(const s of SLIDES){ s.render(); wire(document.getElementById(s.id)); } fit(); }
function applyHash(){
  const h=location.hash, m=h.match(/slide=(\d+)/), t=h.match(/theme=(dark|light)/);
  if(t) document.documentElement.dataset.theme=t[1];
  document.documentElement.classList.toggle('export',!!m);
  document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('only',!!m&&f.dataset.n===m[1]));
}
buildBoard(); applyHash(); renderAll();
const themeBtn=document.getElementById('theme');
const syncBtn=()=>{themeBtn.textContent=document.documentElement.dataset.theme==='dark'?'Light slides':'Dark slides';};
themeBtn.addEventListener('click',()=>{const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; syncBtn(); renderAll();}); syncBtn();
document.getElementById('loadjson').addEventListener('change',ev=>{const files=[...ev.target.files]; let left=files.length; files.forEach(f=>{const rd=new FileReader(); rd.onload=()=>{try{const j=JSON.parse(rd.result); if(j.checks&&j.runs) reports.push(j);}catch(e){} if(--left===0) renderAll();}; rd.readAsText(f);});});
window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{applyHash(); renderAll();});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
