<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>TIMES.jl Parity Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Ten 16:9 slides, each drawn on a fixed 1280 x 720 canvas and scaled as a whole, so every slide
   exports to a Google Slides page (10 x 5.625 in) unchanged: title, accent line, then the chart.
   ESMA brand book: DM Sans (bold headings, regular body); Dark Green #004539, Dark Yellow #eaaa00 and
   White primary; Blue, Light Blue, Charcoal, Green, Turquoise secondary. Logo: the official RGB artwork,
   "on white background" on light slides and "primary" on dark ones, unaltered. */
:root{
  --dark-green:#004539; --dark-yellow:#eaaa00; --white:#ffffff; --off-white:#ebeced;
  --blue:#00a3cb; --light-blue:#10cfc9; --charcoal:#6e7c7c; --green:#00c463; --turquoise:#afe1da;
  --surface:var(--white); --tint:#f3f5f5; --ink:var(--dark-green); --muted:#56625f; --rule:var(--dark-yellow);
  --grid:rgba(0,69,57,.16); --edge:rgba(0,69,57,.35);
  /* status theme (not in the brand book; added for this board) */
  --pass:var(--green); --on-pass:var(--dark-green); --fail:#c8502a; --on-fail:#ffffff;
  --refused:var(--charcoal); --on-refused:#ffffff; --review:var(--dark-yellow);
  --cplex:var(--blue); --highs:var(--dark-green);
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:var(--dark-green); --tint:#0b5446; --ink:var(--white); --muted:var(--turquoise);
  --grid:rgba(255,255,255,.16); --edge:rgba(175,225,218,.45); --highs:var(--white);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:#d9dede;font-family:var(--sans);color:var(--ink)}
:root[data-theme="dark"] body{background:#00241e}
body{padding:20px 16px 40px}
.toolbar{max-width:1440px;margin:0 auto 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:#2c3a37}
:root[data-theme="dark"] .toolbar{color:var(--turquoise)}
.toolbar .btn{border:1px solid currentColor;background:transparent;color:inherit;padding:5px 12px;font:inherit;cursor:pointer;border-radius:999px}
.toolbar .btn:hover,.toolbar .btn:focus-visible{border-color:var(--dark-yellow);outline:none}
.toolbar input[type=file]{display:none}
.toolbar .hint{opacity:.85}
.board{max-width:1440px;margin:0 auto;display:grid;gap:24px}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--surface);color:var(--ink);overflow:hidden}

/* slide frame: title, accent line, content, footer */
.s-head{position:absolute;left:56px;right:56px;top:34px;height:84px;display:flex;justify-content:space-between;align-items:flex-start;gap:32px}
.s-head h1{margin:0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.005em}
.s-head .sub{margin-top:8px;font-size:18px;line-height:1.3;color:var(--muted)}
.logo{flex:none;width:150px;height:92px;margin-top:-10px}
.logo .on-dark{display:none}
:root[data-theme="dark"] .logo .on-white{display:none}
:root[data-theme="dark"] .logo .on-dark{display:inline}
.s-rule{position:absolute;left:56px;right:56px;top:132px;height:4px;background:var(--rule)}
.s-body{position:absolute;left:56px;right:56px;top:156px;height:500px}
.s-foot{position:absolute;left:56px;right:56px;bottom:22px;display:flex;justify-content:space-between;gap:24px;font-size:14px;line-height:1.3;color:var(--muted)}
.s-foot .pg{flex:none;font-weight:700;color:var(--ink)}
.s-body svg{display:block;width:1168px;height:500px;overflow:visible}
svg text{font-family:var(--sans)}
.num{font-variant-numeric:tabular-nums}

/* slide 1 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{background:var(--tint);padding:16px 20px 14px;border-left:6px solid var(--green);min-height:122px}
.kpi.gate{border-left-color:var(--dark-yellow)}
.kpi .v{font-size:44px;font-weight:700;line-height:1.05}
.kpi .v small{font-size:22px;font-weight:500;color:var(--muted)}
.kpi .l{font-size:16px;line-height:1.3;color:var(--muted);margin-top:6px}
.miles-h{margin:26px 0 10px;font-size:18px;font-weight:700}
.miles{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.mile{background:var(--tint);padding:10px 10px 10px;border-top:6px solid var(--edge);min-height:118px}
.mile.done{border-top-color:var(--green)} .mile.active{border-top-color:var(--dark-yellow)}
.mile .id{font-size:20px;font-weight:700}
.mile .t{font-size:15px;line-height:1.25;margin-top:2px}
.mile .n{font-size:14px;line-height:1.25;color:var(--muted);margin-top:6px}

/* legends */
.legend{display:flex;gap:26px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:8px;border:1px solid transparent}
.sw.done,.sw.pass{background:var(--pass)} .sw.fail{background:var(--fail)} .sw.refused,.sw.partial{background:var(--refused)}
.sw.review{background:repeating-linear-gradient(135deg,var(--dark-yellow) 0 4px,transparent 4px 7px);border-color:var(--dark-yellow)}
.sw.todo,.sw.notrun{border:1.5px dashed var(--edge)} .sw.next{border:3px solid var(--dark-yellow)}

/* slide 2 */
.open{columns:2;column-gap:40px;font-size:15px;line-height:1.35;margin:0;padding:0;list-style:none}
.open li{break-inside:avoid;margin-bottom:7px;padding-left:22px;position:relative}
.open li i{position:absolute;left:0;top:3px}
.open b{font-weight:700}

/* slide 3 */
.tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.tile{height:66px;padding:6px 8px;background:var(--tint);border:1.5px dashed var(--edge);overflow:hidden}
.tile .id{font-size:16px;font-weight:700;line-height:1.1}
.tile .t{font-size:14px;line-height:1.2;margin-top:3px}
.tile.done{background:var(--pass);border-color:transparent;color:var(--on-pass)}
.tile.review{background:repeating-linear-gradient(135deg,rgba(234,170,0,.38) 0 6px,var(--tint) 6px 12px);border:2px solid var(--dark-yellow)}
.tile.next{border:3px solid var(--dark-yellow)}

/* slide 4 */
.chain{display:grid;grid-template-columns:736px 1fr;gap:48px}
.note{background:var(--tint);padding:18px 20px;font-size:16px;line-height:1.4;border-left:6px solid var(--dark-yellow)}
.note p{margin:0 0 12px} .note p:last-child{margin:0}
.note b{font-weight:700}

.tip{position:fixed;pointer-events:none;background:#ffffff;color:#004539;border:1px solid #004539;padding:8px 10px;font-size:13px;line-height:1.4;max-width:380px;z-index:5;display:none;font-family:var(--sans)}
.tip b{color:#004539}

/* one slide alone at 1280 x 720 (index.html#slide=N), for screenshots; and print, one slide per page */
html.export body{padding:0;background:var(--surface)}
html.export .toolbar{display:none}
html.export .board{display:block;max-width:none}
html.export .frame{display:none;width:1280px;height:720px;box-shadow:none}
html.export .frame.only{display:block}
@page{size:1280px 720px;margin:0}
@media print{
  body{padding:0;background:none} .toolbar{display:none} .board{display:block;max-width:none}
  .frame{width:1280px;height:720px;box-shadow:none;break-after:page;page-break-after:always}
  .slide{transform:none!important}
}
</style>
</head>

let reports = [...document.querySelectorAll('script[type="application/json"][id^="report"]')]
  .map(e=>e.textContent.trim()).filter(t=>t).map(t=>JSON.parse(t));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (x, d=0) => x==null||isNaN(x) ? "—" : x.toLocaleString('en-GB',{maximumFractionDigits:d});
const compact = x => x==null||isNaN(x) ? "—" : x<1e3 ? String(x) : x<1e4 ? (x/1e3).toFixed(1)+'k' : x<1e6 ? Math.round(x/1e3)+'k' : x<1e7 ? (x/1e6).toFixed(1)+'M' : Math.round(x/1e6)+'M';
const big = x => x==null||isNaN(x) ? "—" : x>=1e6 ? (x/1e6).toFixed(1)+'<small> million</small>' : fmt(x);
const sci = x => x==null||isNaN(x) ? "—" : x===0 ? "0" : x.toExponential(0).replace("e-","e−");
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const isCI = r => (r.source||'').startsWith('test/fixtures');
const shortModel = m => m.replace(/^TIMES_Demo-/,'');
const dateShort = d => d ? new Date(d.slice(0,10)+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const variantName = v => v==='reduce_off' ? 'REDUCE off' : v==='as_run' ? 'as run' : (v||'');

// one result per run: where several reports carry a run (embedded, or loaded with the button), the newest (meta.date) wins
function runOwner(){ const own={}; for(const r of reports) for(const run of r.runs){ const o=own[run.id]; if(!o||(r.meta.date||'')>(o.meta.date||'')) own[run.id]=r; } return own; }
function allRuns(){ const own=runOwner(), seen={}, out=[]; for(const r of reports) for(const run of r.runs){ if(own[run.id]===r&&!seen[run.id]){seen[run.id]=1; out.push(Object.assign({source_commit:r.meta.commit, source_date:r.meta.date}, run));} }
  const rank=x=>isCI(x)?-1:(i=>i<0?999:i)(PLANNED_RUNS.findIndex(p=>p.model===x.model));
  return out.sort((a,b)=>rank(a)-rank(b)); }
function allChecks(){ const own=runOwner(); return reports.flatMap(r=>r.checks.filter(c=>own[c.run]===r)); }
function reportMeta(){ const own=runOwner(), used=reports.filter(r=>Object.values(own).includes(r)), metas=used.map(r=>r.meta);
  const commits=[...new Set(metas.map(m=>(m.commit||'').slice(0,7)))], dates=metas.map(m=>(m.date||'').slice(0,10)).sort();
  const span=dates[0]===dates[dates.length-1]?dates[0]:`${dates[0]} to ${dates[dates.length-1]}`;
  return {n:used.length, span, commits, julia:[...new Set(metas.map(m=>m.julia))], times:metas[0]?metas[0].times_version:''}; }

function svgOpen(h=500,w=1168){ return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px">`; }
function wire(root){ root.querySelectorAll('[data-tip]').forEach(g=>{g.addEventListener('mousemove',e=>showTip(e,g.dataset.tip));g.addEventListener('mouseleave',hideTip);}); }
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const x=Math.min(e.clientX+14,window.innerWidth-400),y=Math.min(e.clientY+14,window.innerHeight-140);tip.style.left=x+'px';tip.style.top=y+'px';}

// a status cell: fill by status, optional centred text
function cell(x,y,w,h,status,text,tipHtml,extra=''){
  const fill={pass:css('--pass'),fail:css('--fail'),refused:css('--refused')}[status];
  const fg={pass:css('--on-pass'),fail:css('--on-fail'),refused:css('--on-refused')}[status]||css('--muted');
  const box=fill?`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/>`
                :`<rect x="${x+.75}" y="${y+.75}" width="${w-1.5}" height="${h-1.5}" fill="none" stroke="${css('--edge')}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  const t=text?`<text x="${x+w/2}" y="${y+h/2+5}" font-size="14" text-anchor="middle" fill="${fg}" class="num">${text}</text>`:'';
  return `<g data-tip="${esc(tipHtml||'')}">${box}${t}${extra}</g>`;
}

// ---- 1: at a glance -----------------------------------------------------------------------------
function renderGlance(){
  const runs=allRuns(), checks=allChecks(), m=reportMeta();
  const pass=checks.filter(c=>c.status==='pass').length, fail=checks.filter(c=>c.status==='fail').length, refused=checks.filter(c=>c.status==='refused').length;
  const l1=checks.filter(c=>c.layer===1), syms=l1.reduce((a,c)=>a+(c.n_compared||0),0);
  const l2=checks.filter(c=>c.layer===2&&c.unit==='matrix'), ents=l2.reduce((a,c)=>a+(c.n_compared||0),0);
  const l3=checks.filter(c=>c.layer===3), worst=l3.length?Math.max(...l3.map(c=>c.rel_diff||0)):NaN;
  const fullParity=runs.filter(r=>{const cs=checks.filter(c=>c.run===r.id); return cs.length&&cs.every(c=>c.status==='pass'||c.status==='skipped');}).length;
  const g=M13_GATE.runs.length*2;
  const k=[
    [`${g}<small> / ${g}</small>`,"M1.3 chain runs that match GAMS from the raw input to the pre-solve point","gate"],
    [`${fullParity}<small> / ${runs.length}</small>`,"runs at full parity on every check run"],
    [`${fmt(pass)}<small> / ${fmt(checks.length)}</small>`,`checks passing · ${fail} failing · ${refused} refused (untranslated path)`],
    [big(syms),"coefficient records equal to GAMS's at 1e-9"],
    [big(ents),"matrix entries (rows, columns, coefficients) equal to GAMS's at 1e-9"],
    [sci(worst),"largest objective difference, relative (the gate is 1e-6)"],
  ];
  set('glance-sub',"Phase 1: a faithful translation of TIMES v4.9.7 · every figure here is checked against GAMS");
  set('glance-body',`<div class="kpis">${k.map(([v,l,c])=>`<div class="kpi ${c||''}"><div class="v num">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="miles-h">Milestones · Phase 1 (faithful translation), then Phase 2 (performance)</div>
    <div class="miles">${MILESTONES.map(x=>`<div class="mile ${x[2]}"><div class="id">${x[0]}${x[2]==='done'?' ✓':''}</div><div class="t">${x[1]}</div>${x[3]?`<div class="n">${x[3]}</div>`:''}</div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px;line-height:1.25;color:${css('--muted')}">${KEY_DATES.map(([d,t])=>`<div><b style="color:${css('--ink')}">${d}</b><br>${t}</div>`).join('')}</div>`);
  set('glance-foot',`${runs.length} runs from ${m.n} parity reports, ${m.span} · commits ${m.commits.join(', ')} · Julia ${m.julia.join(', ')} · TIMES ${m.times}`);
}

// ---- 2: coverage --------------------------------------------------------------------------------
function renderCoverage(){
  const order=["done","partial","review","todo"], names={done:"translated",partial:"translated, some paths refused",review:"in review",todo:"not started"};
  const stages=[]; for(const p of PIPELINE){let s=stages.find(x=>x.name===p[0]); if(!s){s={name:p[0],lines:0,by:{done:0,partial:0,review:0,todo:0},files:[]}; stages.push(s);} s.lines+=p[2]; s.by[p[3]]+=p[2]; s.files.push(p);}
  const total=stages.reduce((a,s)=>a+s.lines,0), started=stages.reduce((a,s)=>a+s.lines-s.by.todo,0);
  const fill={done:css('--pass'),partial:css('--refused'),review:css('--dark-yellow'),todo:'none'};
  const fg={done:css('--on-pass'),partial:css('--on-refused'),review:'#004539',todo:css('--muted')};
  const L=230, BW=938, rh=34, gap=9;
  let s=svgOpen(6*(rh+gap));
  stages.forEach((st,i)=>{const y=i*(rh+gap); let x=L;
    s+=`<text x="0" y="${y+15}" font-size="17" font-weight="700" fill="${css('--ink')}">${st.name}</text><text x="0" y="${y+33}" font-size="14" fill="${css('--muted')}">${fmt(st.lines)} lines of GAMS</text>`;
    for(const k of order){const v=st.by[k]; if(!v) continue; const w=BW*v/st.lines;
      s+= k==='todo' ? `<rect x="${x+.75}" y="${y+.75}" width="${w-1.5}" height="${rh-1.5}" fill="none" stroke="${css('--edge')}" stroke-width="1.5" stroke-dasharray="4 3"/>`
                     : `<rect x="${x}" y="${y}" width="${w-2}" height="${rh}" fill="${fill[k]}"/>`;
      if(w>70) s+=`<text x="${x+10}" y="${y+rh/2+5}" font-size="15" fill="${fg[k]}" class="num">${fmt(v)}</text>`;
      x+=w;}
    });
  s+='</svg>';
  const rank={review:0,todo:1,partial:2}, open=PIPELINE.filter(p=>p[3]!=='done').sort((a,b)=>rank[a[3]]-rank[b[3]]), shown=12;
  set('coverage-sub',`${fmt(started)} of ${fmt(total)} lines of TIMES v4.9.7 GAMS translated or in review (${Math.round(100*started/total)}%)`);
  set('coverage-body',`${s}<div class="legend" style="margin:4px 0 16px">${order.map(k=>`<span><i class="sw ${k}"></i>${names[k]}</span>`).join('')}<span>· numbers: lines of GAMS</span></div>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">Files not yet complete</div><ul class="open">${open.slice(0,shown).map(p=>`<li><i class="sw ${p[3]}"></i><b>${p[1]}</b> · ${p[4]}</li>`).join('')}</ul>`);
  set('coverage-foot',`${open.length>shown?`${open.length-shown} more files translated with refused paths (docs/m13-plan.md) · `:''}refused: TIMES.jl stops with a message rather than give a wrong answer`);
}

    s+= two ? `<text x="0" y="${y+16}" font-size="16" font-weight="700" fill="${real?css('--ink'):css('--muted')}">${shortModel(r.model)}</text><text x="0" y="${y+33}" font-size="14" fill="${css('--muted')}">${variantName(r.variant)} · ${esc(r.licence||'')}</text>`
            : kind==='ci' ? `<text x="0" y="${y+rh/2+5}" font-size="15" fill="${css('--ink')}"><tspan font-weight="700">${shortModel(r.model)}</tspan> · ${variantName(r.variant)}</text>`
            : `<text x="0" y="${y+rh/2+5}" font-size="15" fill="${real?css('--ink'):css('--muted')}"><tspan font-weight="700">${shortModel(r.model)}</tspan>${real?` · ${dateShort(r.source_date)}`:''}</text>`;
    cols.forEach(c=>{const w=c.w;
      if(!real){s+=cell(c.x,y,w,rh,null,'',`<b>${r.model}</b><br>no reference loaded`); return;}
      if(c.k==='fam'){const fs=checks.filter(k=>k.run===r.id&&k.layer===2&&k.unit!=='matrix'); if(!fs.length){s+=cell(c.x,y,w,rh,null,'',`<b>${r.model}</b><br>no family checks`);return;}
        const p=fs.filter(k=>k.status==='pass').length, st=fs.some(k=>k.status==='fail')?'fail':fs.some(k=>k.status==='refused')?'refused':'pass';
        s+=cell(c.x,y,w,rh,st,`${p} / ${fs.length}`,`<b>${r.model}</b> · ${variantName(r.variant)}<br>equation families passing: ${p} of ${fs.length}`); return;}
      const ck=checks.find(k=>k.run===r.id&&String(k.unit).toUpperCase()===c.unit.toUpperCase()&&(c.k==='l1'?k.layer===1:c.k==='mat'?k.layer===2:k.layer===3));
      if(!ck||ck.status==='skipped'){s+=cell(c.x,y,w,rh,null,'',`<b>${r.model}</b> · ${c.label}<br>not run`); return;}
      const txt=c.k==='l3'?(ck.rel_diff!=null?sci(ck.rel_diff):ck.status):ck.status==='refused'?'refused':compact(ck.n_compared);
      const excl=ck.n_excluded>0?`<rect x="${c.x}" y="${y+rh-4}" width="${w*Math.min(1,ck.n_excluded/Math.max(1,ck.n_compared+ck.n_excluded))}" height="4" fill="${css('--dark-yellow')}"/>`:'';
      const info=`<b>${r.model}</b> · ${variantName(r.variant)} · ${c.label}<br>status: ${ck.status}${ck.n_compared!=null?`<br>compared: ${fmt(ck.n_compared)}`:''}${ck.n_excluded?`<br>left to a later file: ${fmt(ck.n_excluded)}`:''}${ck.n_mismatch?`<br>mismatches: ${fmt(ck.n_mismatch)}`:''}${ck.rel_diff!=null?`<br>relative objective difference: ${ck.rel_diff.toExponential(2)}`:''}${(ck.detail||[]).length?`<br>${esc(ck.detail.slice(0,2).join('; '))}`:''}`;
      s+=cell(c.x,y,w,rh,ck.status,txt,info,excl);});});
  s+='</svg>';
  const nCk=checks.filter(c=>runs.some(r=>r.id===c.run)), p=nCk.filter(c=>c.status==='pass').length;
  set(`${kind}-sub`, kind==='ci'
    ? `${runs.length} runs of demo12 and crafted variants (CC BY 4.0), in CI on every pull request · ${fmt(p)} of ${fmt(nCk.length)} checks pass`
    : `REDUCE off, GAMS 54.6.1 references · each run's latest report (date beside it); a whole-model batch refreshes them`);
  set(`${kind}-body`,s);
  set(`${kind}-foot`,(kind==='suite'?`${fmt(p)} of ${fmt(nCk.length)} checks pass · refused: a gap open at the report date (TIMES-NZ and OTCGEN: closed by changes 21-24) · `:'')+"Numbers: records compared at 1e-9 (layers 1-2) and the relative objective difference (layer 3, gate 1e-6) · yellow underline: records left to a later coefficient file · dashed: not run");
}

// ---- 8: equation families -----------------------------------------------------------------------
function renderFamilies(){
  const checks=allChecks().filter(c=>c.layer===2&&c.unit!=='matrix'), runsN=allRuns().length;
  const fams=[...new Set(checks.map(c=>c.unit))].sort();
  const per=Math.ceil(fams.length/3), colW=372, gap=26, rh=Math.min(26,Math.floor(470/per)), lw=150, bw=150;
  const maxN=Math.max(...fams.map(f=>checks.filter(c=>c.unit===f).length));
  let s=svgOpen(500);
  [0,1,2].forEach(b=>{const x0=b*(colW+gap);
    s+=`<text x="${x0}" y="18" font-size="15" font-weight="700" fill="${css('--ink')}">Family</text><text x="${x0+lw}" y="18" font-size="15" font-weight="700" fill="${css('--ink')}">runs compared</text>`;
    fams.slice(b*per,(b+1)*per).forEach((f,j)=>{const y=30+j*rh, cs=checks.filter(c=>c.unit===f), p=cs.filter(c=>c.status==='pass').length, fl=cs.filter(c=>c.status==='fail').length, rf=cs.length-p-fl;
      s+=`<text x="${x0}" y="${y+rh/2+5}" font-size="15" fill="${css('--ink')}">${f}</text>`;
      let x=x0+lw; const seg=(n,col)=>{if(!n)return; const w=bw*n/maxN; s+=`<rect x="${x}" y="${y+4}" width="${w}" height="${rh-8}" fill="${col}"/>`; x+=w;};
      seg(p,css('--pass')); seg(fl,css('--fail')); seg(rf,css('--refused'));
      s+=`<g data-tip="${esc(`<b>${f}</b><br>pass ${p} · fail ${fl} · other ${rf}<br>${cs.map(c=>c.run).join(', ')}`)}"><rect x="${x0}" y="${y}" width="${colW}" height="${rh}" fill="transparent"/></g>`;
      s+=`<text x="${x0+lw+bw+10}" y="${y+rh/2+5}" font-size="15" fill="${css('--ink')}" class="num">${p} / ${cs.length}</text>`;});});
  s+='</svg>';
  const all=checks.length, p=checks.filter(c=>c.status==='pass').length;
  set('families-sub',`${fams.length} families · ${fmt(p)} of ${fmt(all)} family checks pass · rows, columns and coefficients vs GAMS's CONVERT dump at 1e-9`);
  set('families-body',s);
  set('families-foot',`Bar: the runs (of ${runsN}) in which the family has rows, coloured by result · the whole matrix is checked too (slides 6-7)`);
}

// ---- 9: objective -------------------------------------------------------------------------------
function renderObjective(){
  const checks=allChecks().filter(c=>c.layer===3), runs=allRuns().filter(r=>checks.some(c=>c.run===r.id));
  const parts=[runs.filter(isCI),runs.filter(r=>!isCI(r))], titles=["CI test cases (demo12 and crafted variants)","Public reference models"];
  const lo=-16, hi=-3, PW=564, lw=210, ax0=lw+10, ax1=PW-10, X=v=>ax0+(Math.log10(Math.max(v,10**lo))-lo)/(hi-lo)*(ax1-ax0);
  let s=svgOpen(500);
  parts.forEach((rs,b)=>{const x0=b*(PW+40), rh=Math.min(36,Math.floor(400/Math.max(rs.length,1))), top=70, yEnd=top+rs.length*rh;
    s+=`<text x="${x0}" y="18" font-size="16" font-weight="700" fill="${css('--ink')}">${titles[b]}</text>`;
    for(let e=lo;e<=hi;e++){const xx=x0+X(10**e); s+=`<line x1="${xx}" x2="${xx}" y1="${top-8}" y2="${yEnd}" stroke="${css('--grid')}" stroke-width="${e%3===0?1:.5}"/>`; if(e%3===0) s+=`<text x="${xx}" y="${top-16}" font-size="14" text-anchor="middle" fill="${css('--muted')}">1e−${-e}</text>`;}
    const gx=x0+X(1e-6); s+=`<line x1="${gx}" x2="${gx}" y1="${top-8}" y2="${yEnd}" stroke="${css('--dark-yellow')}" stroke-width="3" stroke-dasharray="7 4"/><text x="${gx+6}" y="${yEnd+20}" font-size="14" font-weight="700" fill="${css('--ink')}">gate 1e−6</text>`;
    rs.forEach((r,j)=>{const y=top+j*rh+rh/2;
      s+=`<text x="${x0}" y="${y+5}" font-size="15" fill="${css('--ink')}"><tspan font-weight="700">${shortModel(r.model).replace('-reference','').replace('-v308','')}</tspan> · ${variantName(r.variant)}</text>`;
      SOLVERS.forEach((sv,k)=>{const ck=checks.find(c=>c.run===r.id&&String(c.unit).toUpperCase()===sv); if(!ck||ck.rel_diff==null) return;
        const xx=x0+X(ck.rel_diff), ok=ck.status==='pass', col=k?css('--highs'):css('--cplex');
        const mk=k?`<rect x="${xx-6}" y="${y-6}" width="12" height="12" transform="rotate(45 ${xx} ${y})" fill="${ok?col:css('--fail')}"/>`:`<circle cx="${xx}" cy="${y}" r="7" fill="${ok?col:css('--fail')}"/>`;
        s+=`<g data-tip="${esc(`<b>${r.model}</b> · ${variantName(r.variant)}<br>against GAMS with ${sv}: ${ck.rel_diff.toExponential(2)}<br>GAMS ${fmt(ck.gams_objective,2)} · TIMES.jl ${fmt(ck.julia_objective,2)}`)}">${mk}</g>`;});});});
  s+=`<g transform="translate(${PW+40},400)" font-size="15" fill="${css('--ink')}"><circle cx="8" cy="-5" r="7" fill="${css('--cplex')}"/><text x="24" y="0">TIMES.jl against GAMS with CPLEX</text><rect x="2" y="21" width="12" height="12" transform="rotate(45 8 27)" fill="${css('--highs')}"/><text x="24" y="32">TIMES.jl against GAMS with HiGHS</text><text x="0" y="66" fill="${css('--muted')}">Values below 1e−16 are drawn at 1e−16.</text></g>`;
  s+='</svg>';
  const cf=checks.filter(c=>c.mine_in_gams_violation!=null), ok=cf.filter(c=>c.mine_in_gams_violation<1e-6&&(c.gams_in_mine_ok!=null?c.gams_in_mine_ok:c.gams_in_mine_violation<1e-6)).length;
  set('objective-sub',`|TIMES.jl − GAMS| / |GAMS| for each run and GAMS solver · ${checks.filter(c=>c.status==='pass').length} of ${checks.length} within the 1e-6 gate`);
  set('objective-body',s);
  set('objective-foot',`TIMES.jl solves with HiGHS (OTUS9r: CPLEX's optimum evaluated in TIMES.jl's model, no HiGHS solve) · cross-check: ${ok} of ${cf.length} optima feasible in the other side's matrix`);
}

// ---- 10: timings --------------------------------------------------------------------------------
function renderTiming(){
  const H=440, L=70, R=20, T=30, B=70, W=1168, lo=-2, hi=3.5, y=v=>T+(hi-Math.max(lo,Math.min(hi,Math.log10(Math.max(v,1e-3)))))/(hi-lo)*(H-T-B);
  const sec=v=>fmt(v, v>=100?0:v>=10?1:v>=1?2:3);
  let s=svgOpen(500);
  for(const v of [0.01,0.1,1,10,100,1000]){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${css('--grid')}" stroke-width="1"/><text x="${L-10}" y="${y(v)+5}" font-size="15" text-anchor="end" fill="${css('--muted')}">${fmt(v,2)} s</text>`;}
  const n=TIMINGS.length, gw=(W-L-R)/n, bw=64;
  TIMINGS.forEach((t,i)=>{const x0=L+i*gw+gw/2;
    [[t.gams,css('--cplex')],[t.julia,css('--pass')]].forEach(([v,c],k)=>{const x=x0+(k-0.5)*(bw+10); s+=`<rect x="${x-bw/2}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" fill="${c}"/><text x="${x}" y="${y(v)-8}" font-size="15" text-anchor="middle" fill="${css('--ink')}" class="num">${sec(v)} s</text>`;});
    const tg=y(t.gams*5); s+=`<line x1="${x0-bw-14}" x2="${x0+bw+14}" y1="${tg}" y2="${tg}" stroke="${css('--dark-yellow')}" stroke-width="3" stroke-dasharray="7 4"/>`;
    s+=`<text x="${x0}" y="${H-B+26}" font-size="17" font-weight="700" text-anchor="middle" fill="${css('--ink')}">${t.short}</text><text x="${x0}" y="${H-B+48}" font-size="15" text-anchor="middle" fill="${css('--muted')}">${t.rows>=1e6?fmt(t.rows/1e6,1)+' M':fmt(t.rows)} rows · ${fmt(t.julia/t.gams)}× GAMS</text>`;});
  s+=`<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="${css('--ink')}" stroke-width="1"/>`;
  s+=`<g transform="translate(${L},486)" font-size="15" fill="${css('--ink')}"><rect x="0" y="-13" width="16" height="16" fill="${css('--cplex')}"/><text x="24" y="0">GAMS 54.6.1, its own profile</text><rect x="270" y="-13" width="16" height="16" fill="${css('--pass')}"/><text x="294" y="0">TIMES.jl, warm, one thread</text><line x1="540" x2="580" y1="-5" y2="-5" stroke="${css('--dark-yellow')}" stroke-width="3" stroke-dasharray="7 4"/><text x="590" y="0">Phase 1 target: within 5× GAMS (M1.7)</text></g>`;
  s+='</svg>';
  set('timing-sub',"Seconds for the coefficient stage, same machine, log scale · making TIMES.jl fast is Phase 2 work (item P2-2)");
  set('timing-body',s);
  set('timing-foot',"James's workstation, 2× Xeon Gold 6256 · TIMES.jl on Julia 1.13.2 (31 Oct) vs GAMS 54.6.1 (30-31 Oct) · docs/timings.md · GAMS times come in 1/64 s steps");
}

// ---- 11: cuOpt on the GPU ----------------------------------------------------------------------
// cuOpt reports embedded as cuopt-* blocks (scripts/cuopt): the newest per GPU is shown
function cuoptReports(){
  const all=[...document.querySelectorAll('script[type="application/json"][id^="cuopt-"]')].map(e=>{try{const j=JSON.parse(e.textContent); j._src=e.dataset.src||''; return j;}catch(_){return null;}}).filter(j=>j&&j.checks&&j.meta);
  const by={}; all.forEach(r=>{const k=r.meta.gpu||r._src; if(!by[k]||(r.meta.date||'')>(by[k].meta.date||'')) by[k]=r;}); return Object.values(by);
}
function renderCuopt(){
  const R=cuoptReports();
  set('cuopt-foot',"scripts/cuopt · informational, never a merge gate · pass = objective within 1e-6 of GAMS's and the optimum feasible in GAMS's matrix at 1e-6");
  if(!R.length){ set('cuopt-sub','No cuOpt results embedded yet'); set('cuopt-body',`<div class="note"><p>${esc(CUOPT_NOTES.github)}</p></div>`); return; }
  const r=R[0], m=r.meta, C=r.checks.filter(c=>c.layer===3);
  const runs=[...new Set(C.map(c=>c.run))], M=['barrier','pdlp'];
  const pick=(run,mth)=>{const cs=C.filter(c=>c.run===run&&c.method===mth); return cs.find(c=>String(c.gams_solver).toUpperCase()==='CPLEX')||cs[0];};
  const st=mth=>{const cs=C.filter(c=>c.method===mth), rd=cs.map(c=>c.rel_diff).filter(x=>x!=null), fv=cs.map(c=>c.mine_in_gams_violation).filter(x=>x!=null);
    const miss=cs.filter(c=>c.status!=='pass'&&c.rel_diff!=null).map(c=>c.rel_diff);
    return {n:cs.length, ok:cs.filter(c=>c.status==='pass').length, hi:Math.max(...rd), fv:Math.max(...fv),
      above:cs.filter(c=>c.julia_objective!=null&&c.julia_objective>c.gams_objective).length, done:cs.filter(c=>c.julia_objective!=null).length,
      err:[...new Set(cs.filter(c=>c.julia_objective==null).map(c=>c.run))], missLo:miss.length?Math.min(...miss):NaN, missHi:miss.length?Math.max(...miss):NaN,
      tmax:Math.max(...cs.map(c=>c.cuopt_seconds||0)), slow:cs.reduce((a,c)=>(c.cuopt_seconds||0)>(a.cuopt_seconds||0)?c:a,{})};};
  const B=st('barrier'), P=st('pdlp'), short=x=>String(x||'').replace(/^demo12_/,'');
  // left: one row per CI test case, a cell per method: the relative objective difference against GAMS with CPLEX
  const rh=Math.min(24,Math.floor(440/runs.length)), x0=130, cw=130, top=34;
  let s=svgOpen(500,560);
  M.forEach((mth,k)=>s+=`<text x="${x0+k*(cw+8)+cw/2}" y="20" font-size="14" font-weight="700" text-anchor="middle" fill="${css('--ink')}">${mth==='pdlp'?'PDLP':'barrier'} + crossover</text>`);
  s+=`<text x="${x0+2*(cw+8)+4}" y="20" font-size="15" font-weight="700" fill="${css('--ink')}">seconds</text>`;
  runs.forEach((run,i)=>{const y=top+i*rh;
    s+=`<text x="${x0-10}" y="${y+rh/2+5}" font-size="14" text-anchor="end" fill="${css('--ink')}">${esc(short(run))}</text>`;
    M.forEach((mth,k)=>{const c=pick(run,mth); if(!c) return;
      const v=c.rel_diff!=null?c.rel_diff.toExponential(1).replace('e-','e−'):(c.termination==='NUMERICAL_ERROR'?'numerical error':String(c.termination||'error').toLowerCase());
      s+=cell(x0+k*(cw+8),y+1,cw,rh-3,c.status==='pass'?'pass':'fail',v,`<b>${esc(run)}</b> · ${mth}<br>${esc(c.termination||'')} · against GAMS with ${esc(c.gams_solver)}: ${c.rel_diff!=null?c.rel_diff.toExponential(2):'—'}<br>cuOpt ${fmt(c.cuopt_seconds,2)} s · optimum in GAMS's matrix: ${c.mine_in_gams_violation!=null?c.mine_in_gams_violation.toExponential(1):'—'}`);});
    const tb=pick(run,'barrier'), tp=pick(run,'pdlp');
    s+=`<text x="${x0+2*(cw+8)+4}" y="${y+rh/2+5}" font-size="13" fill="${css('--muted')}" class="num">${fmt(tb&&tb.cuopt_seconds,1)} · ${fmt(tp&&tp.cuopt_seconds,1)}</text>`;});
  s+='</svg>';
  const kp=[[`${P.ok}<small> / ${P.n}</small>`,'PDLP + crossover: checks within 1e-6 of GAMS'],[`${B.ok}<small> / ${B.n}</small>`,'barrier + crossover (the gating method): checks within 1e-6']];
  const ins=[
    `<b>PDLP + crossover matches GAMS:</b> every objective within ${sci(P.hi)} of GAMS's, so crossover finds GAMS's own optimal vertex.`,
    `<b>Barrier stops just short of the optimum:</b> its misses are ${B.missLo.toExponential(1)} to ${B.missHi.toExponential(1)}; every barrier objective is above GAMS's (${B.above} of ${B.done}), and every point is feasible in GAMS's matrix (worst ${sci(B.fv)}). A solver tolerance, not a model difference${B.err.length?`. ${esc(B.err.map(short).join(', '))}: numerical error`:''}.`,
    `<b>Repeatable:</b> ${esc(CUOPT_NOTES.nights)}.`,
    `<b>Too small to time the GPU:</b> every solve took under ${fmt(Math.ceil(Math.max(B.tmax,P.tmax)))} s (longest: ${esc(short(P.slow.run))}, PDLP). GPU speed needs the large open models.`,
    esc(CUOPT_NOTES.github),
  ];
  set('cuopt-sub',`${esc(r._src)} · ${esc(m.gpu||'')} · cuOpt ${esc(m.cuopt_version||'')} · ${dateShort(m.date)} · ${runs.length} CI test cases, against GAMS with CPLEX and HiGHS`);
  set('cuopt-body',`<div style="display:grid;grid-template-columns:560px 1fr;gap:28px"><div>${s}</div><div><div class="kpis" style="grid-template-columns:1fr 1fr;gap:12px">${kp.map(([v,l])=>`<div class="kpi" style="min-height:96px"><div class="v num">${v}</div><div class="l">${l}</div></div>`).join('')}</div>
    <div class="note" style="margin-top:14px;font-size:15px">${ins.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`);
}

// ---- page ---------------------------------------------------------------------------------------
function fit(){ document.querySelectorAll('.frame').forEach(f=>{const k=f.clientWidth/1280; f.firstElementChild.style.transform=Math.abs(k-1)<1e-3?'':`scale(${k})`;}); }
function renderAll(){ for(const s of SLIDES){ s.render(); wire(document.getElementById(s.id)); } fit(); }
function applyHash(){
  const h=location.hash, m=h.match(/slide=(\d+)/), t=h.match(/theme=(dark|light)/);
  if(t) document.documentElement.dataset.theme=t[1];
  document.documentElement.classList.toggle('export',!!m);
  document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('only',!!m&&f.dataset.n===m[1]));
}
buildBoard(); applyHash(); renderAll();
const themeBtn=document.getElementById('theme');
const syncBtn=()=>{themeBtn.textContent=document.documentElement.dataset.theme==='dark'?'Light slides':'Dark slides';};
themeBtn.addEventListener('click',()=>{const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; syncBtn(); renderAll();}); syncBtn();
document.getElementById('loadjson').addEventListener('change',ev=>{const files=[...ev.target.files]; let left=files.length; files.forEach(f=>{const rd=new FileReader(); rd.onload=()=>{try{const j=JSON.parse(rd.result); if(j.checks&&j.runs) reports.push(j);}catch(e){} if(--left===0) renderAll();}; rd.readAsText(f);});});
window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{applyHash(); renderAll();});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
