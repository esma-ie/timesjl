name: Nightly GPU (cuOpt)

# Layer 3 with NVIDIA cuOpt on a GitHub GPU runner (scripts/cuopt/README.md):
# the public CI fixtures, solved by cuOpt (barrier and PDLP, each with
# crossover) and checked against the GAMS optima at 1e-6.
#
# Informational: pull requests do not trigger it and it is not a required
# check. Off until the repository variable CUOPT_NIGHTLY is "true". It runs on
# the GPU larger runner named by the variable GPU_RUNNER (default gpu-t4: Linux,
# 4 vCPU, Tesla T4 16 GB, NVIDIA GPU-optimised image). Larger runners are billed
# per minute, also on public repositories.

on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC every night
  workflow_dispatch:
    inputs:
      methods:
        description: 'cuOpt methods, space-separated: barrier, pdlp, dual_simplex'
        default: 'barrier pdlp'
      only:
        description: 'Fixture prefixes, comma-separated (empty: every fixture with a GAMS optimum)'
        default: ''
      cuda:
        description: 'CUDA major version of the cuOpt wheel'
        type: choice
        options: ['12', '13']
        default: '12'

permissions:
  contents: read

concurrency:
  group: nightly-gpu
  cancel-in-progress: false

jobs:
  cuopt:
    name: cuOpt layer 3 (GPU)
    if: github.repository == 'esma-ie/TIMESjl' && vars.CUOPT_NIGHTLY == 'true'
    runs-on: ${{ vars.GPU_RUNNER || 'gpu-t4' }}
    timeout-minutes: 90
    env:
      CUOPT_WHEEL: libcuopt-mathopt-cu${{ inputs.cuda || '12' }}==26.10.*   # cuOpt.jl 0.5.0 loads only 26.10
      TIMESJL_THREADS: '4'                                                   # the runner's vCPUs
    steps:
      - uses: actions/checkout@v4

      - name: GPU
        run: nvidia-smi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cuOpt 26.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$CUOPT_WHEEL"
          LIBDIR=$(python -I -c "import libcuopt_mathopt, os; print(os.path.join(os.path.dirname(libcuopt_mathopt.__file__), 'lib64'))")
          echo "LD_LIBRARY_PATH=$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2

      - name: Instantiate scripts/cuopt
        run: julia --project=scripts/cuopt -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: cuOpt layer 3 on the public fixtures
        env:
          METHODS: ${{ inputs.methods || 'barrier pdlp' }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(cuopt.json --summary cuopt.md --quiet)
          for m in $METHODS; do args+=(--method "$m"); done
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          julia --project=scripts/cuopt scripts/cuopt/cuopt_layer3.jl "${args[@]}"

      - name: Job summary
        if: always()
        run: if [ -f cuopt.md ]; then cat cuopt.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuopt-layer3-${{ github.run_id }}
          path: |
            cuopt.json
            cuopt.md
          retention-days: 30
          if-no-files-found: ignore
