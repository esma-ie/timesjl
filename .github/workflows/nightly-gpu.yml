name: Nightly GPU (cuOpt)

# Layer 3 with NVIDIA cuOpt on a GitHub GPU runner (scripts/cuopt/README.md):
# public CI fixtures solved by cuOpt (barrier and PDLP, each with crossover)
# and checked against the GAMS optima at 1e-6, at one or more shares of the
# GPU (scripts/cuopt/sweep.sh: NVIDIA MPS caps a run to 25% or 50% of the
# GPU's threads; one level at a time).
#
# Informational: pull requests do not trigger it and it is not a required
# check. On since 10 Nov 2026 (James); set the repository variable
# CUOPT_NIGHTLY to "false" to switch it off. It runs on the GPU larger runner
# named by the variable GPU_RUNNER (default gpu-t4: Linux, 4 vCPU, Tesla T4
# 16 GB, NVIDIA GPU-optimised image). Larger runners are billed per minute,
# also on public repositories.
#
# What it runs: the workflow inputs (manual runs), else the repository
# variables CUOPT_FIXTURES, CUOPT_GPU_SHARES and CUOPT_METHODS, else
# demo12_off at 25, 50 and 100% with barrier and PDLP. CUOPT_FIXTURES=all
# runs every public fixture with a GAMS optimum.

on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC every night
  workflow_dispatch:
    inputs:
      only:
        description: 'Fixtures, comma-separated, or all (empty: variable CUOPT_FIXTURES, else demo12_off)'
        default: ''
      shares:
        description: 'GPU shares in percent, space-separated (empty: variable CUOPT_GPU_SHARES, else 25 50 100)'
        default: ''
      methods:
        description: 'cuOpt methods, space-separated: barrier, pdlp, dual_simplex (empty: variable CUOPT_METHODS, else barrier pdlp)'
        default: ''
      cuda:
        description: 'CUDA major version of the cuOpt wheel'
        type: choice
        options: ['12', '13']
        default: '12'

permissions:
  contents: read

concurrency:
  group: nightly-gpu
  cancel-in-progress: false

jobs:
  cuopt:
    name: cuOpt layer 3 (GPU)
    if: github.repository == 'esma-ie/TIMESjl' && vars.CUOPT_NIGHTLY != 'false'
    runs-on: ${{ vars.GPU_RUNNER || 'gpu-t4' }}
    timeout-minutes: 180
    env:
      CUOPT_WHEEL: libcuopt-mathopt-cu${{ inputs.cuda || '12' }}==26.10.*   # cuOpt.jl 0.5.0 loads only 26.10
      TIMESJL_THREADS: '4'                                                   # the runner's vCPUs
      FIXTURES: ${{ inputs.only || vars.CUOPT_FIXTURES || 'demo12_off' }}
      SHARES: ${{ inputs.shares || vars.CUOPT_GPU_SHARES || '25 50 100' }}
      METHODS: ${{ inputs.methods || vars.CUOPT_METHODS || 'barrier pdlp' }}
    steps:
      - uses: actions/checkout@v4

      - name: GPU
        run: |
          nvidia-smi
          command -v nvidia-cuda-mps-control || echo "no nvidia-cuda-mps-control: levels below 100% will be skipped"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cuOpt 26.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$CUOPT_WHEEL"
          LIBDIR=$(python -I -c "import libcuopt_mathopt, os; print(os.path.join(os.path.dirname(libcuopt_mathopt.__file__), 'lib64'))")
          echo "LD_LIBRARY_PATH=$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2

      - name: Instantiate scripts/cuopt
        run: julia --project=scripts/cuopt -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: cuOpt layer 3 at each GPU share
        run: |
          echo "fixtures: $FIXTURES; GPU shares: $SHARES; methods: $METHODS"
          args=(--only "$FIXTURES" --quiet)
          for m in $METHODS; do args+=(--method "$m"); done
          scripts/cuopt/sweep.sh --out cuopt --shares "$SHARES" -- "${args[@]}"

      - name: Job summary
        if: always()
        run: if [ -f cuopt/sweep.md ]; then cat cuopt/sweep.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuopt-layer3-${{ github.run_id }}
          path: cuopt/
          retention-days: 30
          if-no-files-found: ignore
