# Whole-model parity fixtures, from openly licensed test models only
# (CLAUDE.md "Test-model licences"; docs/test-models.md).
# test/unit/test_public_parity.jl runs every entry and fails if its model is
# not in reference/suite.toml with redistribute = "public".
#
# Make a fixture from a reference run (reference/README.md), from the repo root:
#   julia --project=test scripts/make_m11_fixture.jl <reference>/<model>/<variant> <prefix>
#   julia --project=test scripts/make_m12_fixture.jl <reference>/<model>/<variant> <prefix>
# then add an entry below. Each layer runs when its files exist:
#   <prefix>_presolve, <prefix>_matrix   layer 2: the whole matrix vs CONVERT, 1e-9
#   <prefix>_solution.json               layer 3: objective and both optima, 1e-6
#   <prefix>_ppm, <prefix>_coef          layer 1: coef_cpt!, coef_nio!, coef_ptr!,
#                                        on the symbols listed in coef_symbols, 1e-9
#
# Example (not yet made; needs a licensed GAMS run of TIMES_Demo demo12):
#
# [[fixture]]
# prefix   = "demo12_off"
# model    = "TIMES_Demo-demo12"      # name in reference/suite.toml
# variant  = "reduce_off"
# reduce   = false                    # %REDUCE% YES: cal_red.red (M1.3 change 17b)
# switches = { OBJ = "MOD", VDA = "YES", DSCAUTO = "YES" }   # the run file's $SET switches
# # optional: expected sizes, checked when given
# rows = 0
# cols = 0
# nonzeros = 0
# # optional: layer 1 of the coefficient files; symbols that later GAMS code
# # does not reassign on this model (TIMES.later_overwrites handles coef_ext.vda)
# coef_symbols = ["COEF_AF", "COEF_ICOM", "COEF_OCOM", "COEF_PTRAN"]

# TIMES_Demo demo12 (etsap-TIMES/TIMES_Demo @ 962db86, CC BY 4.0), from the
# licensed reference run of 21 Oct 2026 (GAMS 52.1.0 + CPLEX on James's
# workstation; TIMES v4.9.7 @ d9a6a25). GAMS/HiGHS failed under that licence
# (no HiGHS above 2,000 rows), so the solution file holds the CPLEX optimum only.
[[fixture]]
prefix   = "demo12_off"
model    = "TIMES_Demo-demo12"
variant  = "reduce_off"
reduce   = false
# every $SET of the run file the harness generated (_work/.../presolve/tjl_reference.run)
# (one line: a multi-line inline table is TOML 1.1, which Julia 1.10's parser rejects)
switches = { BOTIME = "1960", DATAGDX = "YES", DEBUG = "NO", DSCAUTO = "YES", DUMPSOL = "NO", OBJ = "MOD", REDUCE = "NO", RUN_NAME = "demo12", SOLVEDA = "YES", SOLVE_NOW = "NO", VAR_UC = "YES", VDA = "YES", VEDAVDD = "YES", XTQA = "YES" }
