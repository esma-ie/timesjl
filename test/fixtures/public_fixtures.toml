cols = 9669
nonzeros = 31391
# layer 1 of the whole coefficient stage: coef_cpt, coef_nio, coef_ptr, coef_obj
# (with filparam.gms and fillcost.gms), coef_alt, coef_shp and coef_ext.vda; with
# OBJ MOD (%CTST% **0) COEF_CPT comes from coef_alt.lin, so it is listed with
# that file's symbols
coef_symbols = ["SOW", "SW_T", "B", "E", "M", "D", "MY_TS", "NCAP_AF", "NCAP_AFS", "COEF_AF", "RTPS_BD", "NCAP_AFBX",
                "RTP_ISHPR", "COEF_ICOM", "COEF_OCOM", "COEF_RCOM", "NCAP_OCOM", "NCAP_CLAG", "NCAP_CLED", "RPC_CAPFLO",
                "COEF_PTRAN", "RPCC_FFUNC", "PRC_CG", "KEEP_FLOF", "ACT_FLO", "CGTEST", "CGTES2",
                "TS_ANN", "EACHYEAR", "Y", "YK", "Y_EOH", "YR_V1", "YR_VL", "ACL", "G_DRATE", "OBJ_DISC", "G_DYEAR",
                "G_RCUR", "OBJ_PVT", "COEF_PVT", "OBJ_RFR", "OBJ_COMNT", "OBJ_COMPD", "OBJ_IPRIC", "FLO_COST",
                "FLO_DELIV", "OBJ_VFLO", "NCAP_ISPCT", "OB_ICOST", "OB_ISUB", "OB_ITAX", "OB_FOM", "OB_FSB", "OB_FTX",
                "OB_DCC", "OB_DLC", "OB_ACT", "OB_FCOS", "OB_FDEL", "OB_FTAX", "OBJ_FSUB", "RPC_CUR", "X_RP", "OB_COM",
                "OB_IRE", "SHEDJ", "SHAPED", "FIL",
                "PERDINV", "TPULSEYR", "TPULSE", "OBJ_LINT", "OBJ_ALTV", "RTP_CAPVL", "RB", "R_DF", "COEF_CPT", "PASTSUM",
